name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  get-active-python-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        run: |
          # Fetch JSON from endoflife.date and filter out versions where the EOL date has passed
          VERSIONS=$(curl -s https://endoflife.date/api/python.json | jq -c '[.[] | select(.eol > (now | todate | .[0:10])) | .cycle]')
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT


  build:

    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{fromJSON(needs.get-active-python-versions.outputs.matrix)}}
        os: [ubuntu-latest, windows-latest, macos-latest]


    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install pandoc on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update && sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

    - name: Install gotranx
      run: |
        python -m pip install -e ".[test]"
    - name: Test with pytest
      env:
        # The compile tests fail instead of skipping without a C compiler. Windows skips
        # them until MSVC is supported.
        GOTRANX_REQUIRE_CC: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      run: |
        # The tests that run Julia and nvcc have workflows of their own (julia.yml, cuda.yml)
        python -m pytest -m "not julia and not cuda" --cov=gotranx --cov-report html --cov-report xml --cov-report term-missing -v

    - name: Coverage report
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
      run: |
        python3 -m coverage report | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
        python3 -m coverage json
        export TOTAL=$(python3 -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
        echo "total=$TOTAL" >> $GITHUB_ENV

    - name: Upload HTML report.
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: html-report
        path: htmlcov
