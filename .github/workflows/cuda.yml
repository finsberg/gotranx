name: CUDA

# Runs the tests marked `cuda`: the code generated by ode2cuda, compiled with nvcc, which
# needs no GPU, for CUDA 12 and 13. The other workflows skip them. The kernels' numerics are
# checked on the CPU in the main workflow (tests/test_cuda_kernels.py).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUDA 13 no longer supports Volta (sm_70) and older
          - cuda: "13"
            archs: "sm_75,sm_90"
          - cuda: "12"
            archs: "sm_70,sm_90"
    env:
      # A missing nvcc fails these tests instead of skipping them
      GOTRANX_REQUIRE_NVCC: "1"
      GOTRANX_CUDA_ARCHS: ${{ matrix.archs }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The pip package has no nvcc for CUDA 12, so CUDA 12 comes from NVIDIA's installer
      - name: Install nvcc (CUDA 12)
        if: matrix.cuda == '12'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart"]'

      - name: Install nvcc (CUDA 13)
        if: matrix.cuda == '13'
        run: python -m pip install nvidia-cuda-nvcc

      - name: Install gotranx
        run: python -m pip install -e ".[test]"

      - name: Compile the generated CUDA code with nvcc
        run: python -m pytest -m cuda -v
