name: Julia

# Runs the tests marked `julia`: code generated by ode2julia and ode2cytozoo, run in Julia and
# in CytoZoo.jl, against the Python backend. The other workflows skip them.

on:
  pull_request:
  push:
    branches: [main]

# julia-actions/cache deletes the caches it replaces
permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # A missing julia or CytoZoo.jl fails these tests instead of skipping them
      GOTRANX_REQUIRE_JULIA: "1"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v3

      # CytoZoo.jl is not registered, so it is added by URL, into the default environment
      # that the tests' `julia` processes load it from
      - name: Install CytoZoo.jl
        run: julia -e 'using Pkg; Pkg.add(url="https://github.com/DerangedIons/CytoZoo.jl")'

      - name: Install gotranx
        run: python -m pip install -e ".[test]"

      - name: Test with pytest
        run: python -m pytest -m julia -v
