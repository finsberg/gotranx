# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: gotranx
author: Henrik Finsberg
logo: docs/_static/logo.png
copyright: "2024"
only_build_toc_files: true


execute:
  execute_notebooks: cache
  timeout: 3000

# Information about where the book exists on the web
repository:
  url: https://github.com/finsberg/gotranx # Online location of your book
  branch: main


html:
  use_issues_button: true
  use_repository_button: true

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - linkify
    - html_image

sphinx:

  config:
    html_last_updated_fmt: "%b %d, %Y"
    nb_execution_show_tb: True
    suppress_warnings: ["mystnb.unknown_mime_type"]
    # gotranx.myokit imports myokit inside its functions, so `myokit.Model` in an
    # annotation cannot be evaluated, and autodoc then keeps every annotation of that
    # function as a string. The bare `ODE` then matches both gotranx.ODE and
    # gotranx.ode.ODE, and -W fails the build. The alias lets the evaluation succeed.
    autodoc_type_aliases:
      myokit.Model: myokit.Model
    nb_custom_formats:  # https://jupyterbook.org/en/stable/file-types/jupytext.html#file-types-custom
        .py:
            - jupytext.reads
            - fmt: py
        .jl:  # run on the `julia` kernel, which IJulia installs
            - jupytext.reads
            - fmt: jl

  extra_extensions:
  - 'sphinx.ext.autodoc'
  - 'sphinx.ext.napoleon'
  - 'sphinx.ext.viewcode'
  - 'sphinxcontrib.mermaid'

exclude_patterns: [".pytest_cache/*" ,"tests", venv, sandbox, joss-paper, demo, .vcode, .ruff_cache, .github, .git]
