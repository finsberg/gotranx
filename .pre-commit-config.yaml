# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/compose_files/(land_2017\.ode|tentusscher_2006_epi\.cellml)$  # verbatim copies, checked by sha256
      - id: end-of-file-fixer
        exclude: ^tests/compose_files/(land_2017\.ode|tentusscher_2006_epi\.cellml)$  # verbatim copies, checked by sha256
      - id: check-yaml
      - id: check-added-large-files
      - id: check-docstring-first
      - id: debug-statements
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 'v0.17.5'
    hooks:
       # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: ["types-attrs"]
        files: ^src/|^tests/
        args: ["--config-file", "pyproject.toml"]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.1
    hooks:
      - id: cspell
        files: src/|docs/(.+).md|tests|README.md|examples/(.+).py
        # Exclude .cellml and .ode files from spell checking.
        exclude: \.cellml$|\.ode$|\.lark$|\.mmt$
